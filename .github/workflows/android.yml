name: Build Kasir Durian APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o Kasir-DurianAndroid.zip
          find . -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          cd KasirDurianAndroid
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kasir-Durian-APK
          path: KasirDurianAndroid/app/build/outputs/apk/debug/app-debug.apk
